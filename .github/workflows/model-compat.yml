name: H3 model compatibility

on:
  push:
    paths:
      - "src/h3_model_config.c"
      - "src/h3_model_config.h"
      - "src/h3_model_compat.c"
      - "scripts/h3_model_info.py"
      - "scripts/h3_model_metadata.py"
      - "scripts/h3_safetensors_info.py"
      - "scripts/run-3070ti-8gb.sh"
      - "scripts/test-model-compat.sh"
      - "tests/test_h3_model_info.py"
      - "tests/test_model_config.c"
      - "docs/STABLE_DIFFUSION_CPP_ALIGNMENT.md"
      - ".github/workflows/model-compat.yml"
  pull_request:
    paths:
      - "src/h3_model_config.c"
      - "src/h3_model_config.h"
      - "src/h3_model_compat.c"
      - "scripts/h3_model_info.py"
      - "scripts/h3_model_metadata.py"
      - "scripts/h3_safetensors_info.py"
      - "scripts/run-3070ti-8gb.sh"
      - "scripts/test-model-compat.sh"
      - "tests/test_h3_model_info.py"
      - "tests/test_model_config.c"
      - "docs/STABLE_DIFFUSION_CPP_ALIGNMENT.md"
      - ".github/workflows/model-compat.yml"

permissions:
  contents: read

concurrency:
  group: model-compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Python ${{ matrix.python-version }} / C11
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run model compatibility tests
        run: ./scripts/test-model-compat.sh
